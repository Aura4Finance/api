components:
  schemas:
    Paylink:
      type: object
      properties:
        id:
          description: Paylink unique identifier
          type: string
          example: paylink_abc123
        title:
          description: Paylink title
          type: string
          example: Product Payment
        description:
          description: Paylink description
          type: string
          example: Payment for awesome product
        amount:
          description: Payment amount
          type: number
          example: 100
        currency:
          description: Currency code
          type: string
          example: USDC
        imageBlobIds:
          description: Array of image blob IDs
          type: array
          items:
            type: string
        mode:
          description: Business mode
          type: string
          example: live
          enum:
            - test
            - live
        profileId:
          description: Associated business profile ID
          type: string
          example: profile_123
        createdAt:
          description: Creation timestamp
          type: string
          format: date-time
        updatedAt:
          description: Last update timestamp
          type: string
          format: date-time
    Payment:
      type: object
      properties:
        id:
          description: Payment unique identifier
          type: string
          example: payment_abc123
        amount:
          description: Payment amount
          type: number
          example: 100
        amountInUSDC:
          description: Amount converted to USDC
          type: number
          example: 100
        token:
          description: Token/currency used
          type: string
          example: USDC
        depositAddress:
          description: Wallet address for deposits
          type: string
          example: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb'
        txRef:
          description: Transaction reference
          type: string
          example: tx_ref_123
        status:
          description: Payment status
          type: string
          example: CONFIRMED
          enum:
            - INITIALIZED
            - CONFIRMED
            - FAILED
        paymentMethod:
          description: Payment method used
          type: string
          example: HOSTED_CHECKOUT
          enum:
            - PAYMENT_LINK
            - HOSTED_CHECKOUT
            - SUBSCRIPTION
        subscriptionId:
          description: Associated subscription ID if applicable
          type: string
        subscription:
          $ref: '#/components/schemas/Subscription'
        redirectUrl:
          description: URL to redirect after payment
          type: string
          example: https://example.com/success
        paylinkId:
          description: Associated paylink ID if applicable
          type: string
        customerId:
          description: Associated customer ID
          type: string
        transactionId:
          description: Associated transaction ID
          type: string
        createdAt:
          description: Creation timestamp
          type: string
          format: date-time
    Customer:
      type: object
      properties:
        id:
          description: Customer unique identifier
          type: string
          example: customer_abc123
        firstname:
          description: Customer first name
          type: string
          example: John
        lastname:
          description: Customer last name
          type: string
          example: Doe
        email:
          description: Customer email address
          type: string
          format: email
          example: john.doe@example.com
        totalSpent:
          description: Total amount spent by customer
          type: number
          example: 500.5
        mode:
          description: Mode in which customer was created
          type: string
          enum:
            - test
            - live
        createdAt:
          description: Creation timestamp
          type: string
          format: date-time
    Webhook:
      type: object
      properties:
        id:
          description: Webhook unique identifier
          type: string
          example: webhook_abc123
        url:
          description: Webhook endpoint URL
          type: string
          format: uri
          example: https://example.com/webhook
        secret:
          description: Webhook secret for signature verification
          type: string
        events:
          description: Array of subscribed event types
          type: array
          items:
            type: string
          example:
            - payment.success
            - payment.failed
        createdAt:
          description: Creation timestamp
          type: string
          format: date-time
        updatedAt:
          description: Last update timestamp
          type: string
          format: date-time
    WebhookDelivery:
      type: object
      properties:
        id:
          description: Delivery unique identifier
          type: string
          example: delivery_abc123
        event:
          description: Event type
          type: string
          example: payment.success
        payload:
          description: Event payload data
          type: object
        status:
          description: Delivery status
          type: string
          example: delivered
        createdAt:
          description: Delivery timestamp
          type: string
          format: date-time
        retries:
          description: Number of retry attempts
          type: integer
    Transaction:
      type: object
