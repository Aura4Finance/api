          type: string
        duration:
          type: string
          enum:
            - WEEKLY
            - MONTHLY
            - SIX_MONTHS
            - YEARLY
        amount:
          description: Plan amount
          type: number
          example: 9.99
        currency:
          description: Currency code (3-letter) for the plan
