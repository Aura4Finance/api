          type: number
          example: 100
        currency:
          description: Currency code
          type: string
          example: USDC
        status:
          description: Transaction status
          type: string
          example: CONFIRMED
        type:
          description: Transaction type
          type: string
          example: PAYMENT
        fromAddress:
          description: Source wallet address
          type: string
        toAddress:
          description: Destination wallet address
          type: string
        txDigest:
          description: Transaction digest/hash
          type: string
        createdAt:
          description: Creation timestamp
          type: string
          format: date-time
        updatedAt:
          description: Last update timestamp
          type: string
          format: date-time
    Payout:
      type: object
      properties:
        id:
          description: Payout unique identifier
          type: string
          example: payout_abc123
        walletAddress:
          description: Destination wallet address
          type: string
          example: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb'
        network:
          description: Blockchain network
          type: string
          example: SUI
          enum:
            - SUI
        amount:
          description: Payout amount
          type: string
          example: '10.50'
        status:
          description: Payout status
          type: string
          example: CONFIRMED
          enum:
            - INITIALIZED
            - CONFIRMED
            - FAILED
        txDigest:
          description: Transaction digest
          type: string
        createdAt:
          description: Creation timestamp
          type: string
          format: date-time
    Refund:
      type: object
      properties:
        id:
          description: Refund unique identifier
          type: string
          example: refund_abc123
        amount:
          description: Refunded amount
          type: number
          example: 100
        status:
          description: Refund status
          type: string
          example: CONFIRMED
        transactionId:
          description: Original transaction ID
          type: string
        toAddress:
          description: Refund destination address
