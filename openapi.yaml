openapi: 3.0.3
info:
  title: OraFi Merchant API
  description: Seamless crypto payments API for merchants
  version: 1.0.0
  contact:
    name: OraFi Support
    email: support@orafi.app
servers:
  - url: https://api.orafi.app/v1
    description: Production server
  - url: http://localhost:3000/v1
    description: Local development server
paths:
  /paylink:
    post:
      summary: Create a paylink
      description: Create a new paylink with images. Requires API key authentication and supports up to 4 images.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                payload:
                  description: JSON string containing paylink data (title, description, amount, currency)
                  type: string
                  example: '{"title":"Product","description":"Product description","amount":100,"currency":"USDC"}'
                images:
                  description: Image files (1-4 images required)
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 4
                  minItems: 1
              required:
                - payload
                - images
      responses:
        '201':
          description: Paylink created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Paylink created successfully
                  data:
                    $ref: '#/components/schemas/Paylink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Paylinks
    get:
      summary: Get all paylinks
      description: Retrieve all paylinks for the authenticated merchant
      responses:
        '200':
          description: List of paylinks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Paylinks retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Paylink'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Paylinks
  /paylink/{paylinkId}:
    get:
      summary: Get paylink details
      description: Retrieve details of a specific paylink
      parameters:
        - name: paylinkId
          in: path
          description: The paylink ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Paylink details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Paylink retrieved successfully
                  data:
                    $ref: '#/components/schemas/Paylink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Paylinks
    patch:
      summary: Edit paylink
      description: Update an existing paylink with new images and details
      parameters:
        - name: paylinkId
          in: path
          description: The paylink ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                payload:
                  description: JSON string containing paylink updates (title, description, amount, currency)
                  type: string
                images:
                  description: Image files (up to 4 images total)
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 4
      responses:
        '200':
          description: Paylink updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Paylink updated successfully
                  data:
                    $ref: '#/components/schemas/Paylink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Paylinks
    delete:
      summary: Delete paylink
      description: Delete a specific paylink
      parameters:
        - name: paylinkId
          in: path
          description: The paylink ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Paylink deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Paylink deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - apiKey: []
      tags:
        - Paylinks
  /subscriptions/plans:
    post:
      summary: Create a subscription plan
      description: Create a new subscription plan (merchant only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionPlanRequest'
      responses:
        '201':
          description: Subscription plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Subscription plan created
                  data:
                    $ref: '#/components/schemas/SubscriptionPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Subscriptions
    get:
      summary: Get subscription plans
      description: Retrieve all subscription plans
      responses:
        '200':
          description: List of subscription plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Plans retrieved
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionPlan'
      security:
        - apiKey: []
      tags:
        - Subscriptions
  /subscriptions/plans/{planId}:
    get:
      summary: Get subscription plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plan retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Plan retrieved
                  data:
                    $ref: '#/components/schemas/SubscriptionPlan'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - apiKey: []
      tags:
        - Subscriptions
    patch:
      summary: Update subscription plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionPlanRequest'
      responses:
        '200':
          description: Plan updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Plan updated
                  data:
                    $ref: '#/components/schemas/SubscriptionPlan'
      security:
        - apiKey: []
      tags:
        - Subscriptions
    delete:
      summary: Delete subscription plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plan deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Plan deleted
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - apiKey: []
      tags:
        - Subscriptions
  /subscriptions:
    post:
      summary: Create a subscription for a customer
      description: Create a subscription linked to a plan and customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Subscription created
                  data:
                    $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Subscriptions
  /subscriptions/{subscriptionId}/cancel:
    post:
      summary: Cancel a subscription
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscription canceled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Subscription canceled
                  data:
                    $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - apiKey: []
      tags:
        - Subscriptions
  /subscriptions/customer/{customerId}:
    get:
      summary: Get subscriptions for a customer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscriptions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Subscriptions retrieved
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - apiKey: []
      tags:
        - Subscriptions
  /subscriptions/{subscriptionId}:
    get:
      summary: Get subscription
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscription retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Subscription retrieved
                  data:
                    $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - apiKey: []
      tags:
        - Subscriptions
  /transactions/payment/{paymentId}:
    patch:
      summary: Update payment intent
      description: Update payment intent to generate either deposit or transfer address for payment completion
      parameters:
        - name: paymentId
          in: path
          description: The payment ID to update
          required: true
          schema:
            type: string
        - name: token
          in: query
          description: Optional token/currency to use when updating the payment intent. Defaults to USDC.
          required: false
          schema:
            type: string
            default: USDC
          example: USDC
        - name: intent
          in: query
          description: The payment intent type. Default is transfer_address
          required: false
          schema:
            type: string
            default: transfer_address
            enum:
              - transfer_address
              - deposit_address
      responses:
        '200':
          description: Payment intent updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Payment intent updated successfully
                  data:
                    $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
      tags:
        - Payments
  /transactions/payment:
    post:
      summary: Create hosted payment
      description: Create a new hosted payment. Requires API key authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  description: Payment amount
                  type: number
                  example: 100
                customer:
                  description: Customer information (optional)
                  type: object
                  properties:
                    fullname:
                      type: string
                      example: John Doe
                    email:
                      type: string
                      format: email
                      example: john@example.com
                customerId:
                  description: Existing customer ID (optional)
                  type: string
                  example: cmxsds23...
                currency:
                  description: Payment currency
                  type: string
                  example: USDC
                network:
                  description: Network for payment
                  type: string
                  example: SUI
                  enum:
                    - SUI
                txRef:
                  description: Unique transaction reference
                  type: string
                  example: cmxsds...
                redirectUrl:
                  description: URL to redirect after payment
                  type: string
                  example: www.example.com
              required:
                - amount
                - currency
                - network
      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Payment created successfully
                  data:
                    $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Payments
  /transactions/payment/paylink:
    post:
      summary: Create paylink payment
      description: Create a payment for a specific paylink. Does not require authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paylinkId:
                  description: The paylink ID
                  type: string
                  example: paylink_123
                customer:
                  type: object
                  properties:
                    fullname:
                      type: string
                      example: John Doe
                    email:
                      type: string
                      format: email
                      example: john@example.com
                  required:
                    - fullname
                    - email
              required:
                - paylinkId
                - customer
      responses:
        '201':
          description: Paylink payment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Payment created successfully
                  data:
                    $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
      tags:
        - Payments
  /transactions/payment/{paymentId}/verify:
    post:
      summary: Verify payment
      description: Verify a payment transaction
      parameters:
        - name: paymentId
          in: path
          description: The payment ID to verify
          required: true
          schema:
            type: string
          example: payment_123
      responses:
        '200':
          description: Payment verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Payment verified successfully
                  data:
                    $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
      tags:
        - Payments
  /transactions/payment/{paymentId}/verify-transfer:
    post:
      summary: Verify payment transfer
      description: Verify a payment transfer transaction
      parameters:
        - name: paymentId
          in: path
          description: The payment ID to verify
          required: true
          schema:
            type: string
          example: payment_123
        - name: token
          in: query
          description: Optional token/currency to use for transfer verification. Defaults to USDC.
          required: false
          schema:
            type: string
            default: USDC
          example: USDC
      responses:
        '200':
          description: Payment transfer verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Payment transfer verified successfully
                  data:
                    $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
      tags:
        - Payments
  /webhook/register:
    post:
      summary: Register webhook
      description: Register a webhook URL for receiving payment notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  description: Webhook URL to receive events
                  type: string
                  format: uri
                  example: https://example.com/webhook
              required:
                - url
      responses:
        '200':
          description: Webhook registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Webhook registered successfully
                  data:
                    $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Webhooks
  /webhook:
    get:
      summary: Get webhook details
      description: Retrieve registered webhook details
      responses:
        '200':
          description: Webhook details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Webhook details retrieved successfully
                  data:
                    $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Webhooks
  /webhook/events:
    get:
      summary: Get webhook event types
      description: Get all available webhook event types that can be subscribed to
      responses:
        '200':
          description: Event types retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Webhook events fetched successfully
                  data:
                    type: array
                    items:
                      type: string
                      example: payment.success
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Webhooks
  /webhook/deliveries:
    get:
      summary: Get webhook deliveries
      description: Retrieve webhook delivery history with optional filtering
      parameters:
        - name: status
          in: query
          description: Filter by webhook delivery status
          schema:
            type: string
        - name: transactionId
          in: query
          description: Filter by transaction ID
          schema:
            type: string
        - name: event
          in: query
          description: Filter by event type
          schema:
            type: string
        - name: startDate
          in: query
          description: Start date for filtering
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: End date for filtering
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Webhook deliveries retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Webhook deliveries retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Webhooks
  /webhook/subscribe:
    post:
      summary: Subscribe to webhook events
      description: Subscribe to specific webhook event types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  description: Event type to subscribe to
                  type: string
                  example: payment.success
              required:
                - event
      responses:
        '200':
          description: Successfully subscribed to event
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Successfully subscribed to event
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Webhooks
  /profile:
    get:
      summary: Get profile
      description: Retrieve business profile information
      responses:
        '200':
          description: Profile information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User profile retrived successfully!
                  data:
                    type: object
                    properties:
                      profile:
                        $ref: '#/components/schemas/BusinessProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Profile
  /profile/request-email-change:
    post:
      summary: Request email change
      description: Initiate email address change (OTP will be sent to new email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  description: New email address
                  type: string
                  format: email
                  example: newemail@example.com
              required:
                - email
      responses:
        '200':
          description: Email change requested successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Email change initialised - Check new email for OTP
                  data:
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Profile
  /profile/verify-email-change:
    post:
      summary: Verify email change
      description: Confirm email address change using OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  description: OTP token from email
                  type: string
                  example: '123456'
              required:
                - token
      responses:
        '200':
          description: Email changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Email changed successfully
                  data:
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Profile
  /business/mode:
    post:
      summary: Switch business mode
      description: Switch between test and live mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  description: Business mode to switch to
                  type: string
                  example: live
                  enum:
                    - test
                    - live
              required:
                - mode
      responses:
        '200':
          description: Mode switched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Mode switched successfully
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Business
  /notification:
    post:
      summary: Toggle email notifications
      description: Toggle email notification subscription on or off
      responses:
        '200':
          description: Notification preference updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  payload:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiKey: []
      tags:
        - Notifications
  /transactions:
    get:
      summary: Get all transactions
      description: Retrieve all transactions for the authenticated merchant
      parameters:
        - name: mode
          in: query
          description: Filter by transaction mode
          schema:
            type: string
            enum:
              - test
              - live
        - name: type
          in: query
          description: Filter by transaction type
          schema:
            type: string
            enum:
              - PAYMENT
              - REFUND
              - PAYOUT
        - name: status
          in: query
          description: Filter by transaction status
          schema:
            type: string
            enum:
              - completed
              - pending
              - failed
        - name: customerId
          in: query
          description: Filter by customer ID
          schema:
            type: string
        - name: paymentMethod
          in: query
          description: Filter by payment method used
          schema:
            type: string
            enum:
              - HOSTED_CHECKOUT
              - PAYMENT_LINK
        - name: currency
          in: query
          description: Filter by currency used to intiate transaction
          schema:
            type: string
