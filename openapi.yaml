components:
  schemas:
    Paylink:
      type: object
      properties:
        id:
          type: string
          description: Paylink unique identifier
          example: paylink_abc123
        title:
          type: string
          description: Paylink title
          example: Product Payment
        description:
          type: string
          description: Paylink description
          example: Payment for awesome product
        amount:
          type: number
          description: Payment amount
          example: 100
        currency:
          type: string
          description: Currency code
          example: USDC
        imageBlobIds:
          type: array
          items:
            type: string
          description: Array of image blob IDs
        mode:
          type: string
          enum: [test, live]
          description: Business mode
          example: live
        profileId:
          type: string
          description: Associated business profile ID
          example: profile_123
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    Payment:
      type: object
      properties:
        id:
          type: string
          description: Payment unique identifier
          example: payment_abc123
        amount:
          type: number
          description: Payment amount
          example: 100
        amountInUSDC:
          type: number
          description: Amount converted to USDC
          example: 100
        token:
          type: string
          description: Token/currency used
          example: USDC
        depositAddress:
          type: string
          description: Wallet address for deposits
          example: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb'
        txRef:
          type: string
          description: Transaction reference
          example: tx_ref_123
        status:
          type: string
          enum: [INITIALIZED, CONFIRMED, FAILED]
          description: Payment status
          example: CONFIRMED
        paymentMethod:
          type: string
          enum: [PAYMENT_LINK, HOSTED_CHECKOUT]
          description: Payment method used
          example: HOSTED_CHECKOUT
        redirectUrl:
          type: string
          description: URL to redirect after payment
          example: https://example.com/success
        paylinkId:
          type: string
          description: Associated paylink ID if applicable
        customerId:
          type: string
          description: Associated customer ID
        transactionId:
          type: string
          description: Associated transaction ID
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
    Customer:
      type: object
      properties:
        id:
          type: string
          description: Customer unique identifier
          example: customer_abc123
        firstname:
          type: string
          description: Customer first name
          example: John
        lastname:
          type: string
          description: Customer last name
          example: Doe
        email:
          type: string
          format: email
          description: Customer email address
          example: john.doe@example.com
        totalSpent:
          type: number
          description: Total amount spent by customer
          example: 500.50
        mode:
          type: string
          enum: [test, live]
          description: Mode in which customer was created
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
    Webhook:
      type: object
      properties:
        id:
          type: string
          description: Webhook unique identifier
          example: webhook_abc123
        url:
          type: string
          format: uri
          description: Webhook endpoint URL
          example: https://example.com/webhook
        secret:
          type: string
          description: Webhook secret for signature verification
        events:
          type: array
          items:
            type: string
          description: Array of subscribed event types
          example: [payment.success, payment.failed]
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          description: Delivery unique identifier
          example: delivery_abc123
        event:
          type: string
          description: Event type
          example: payment.success
        payload:
          type: object
          description: Event payload data
        status:
          type: string
          description: Delivery status
          example: delivered
        createdAt:
          type: string
          format: date-time
          description: Delivery timestamp
        retries:
          type: integer
          description: Number of retry attempts
    Transaction:
      type: object
      properties:
        id:
          type: string
          description: Transaction unique identifier
          example: tx_abc123
        amount:
          type: number
          description: Transaction amount
          example: 100
        currency:
          type: string
          description: Currency code
          example: USDC
        status:
          type: string
          description: Transaction status
          example: CONFIRMED
        type:
          type: string
          description: Transaction type
          example: PAYMENT
        fromAddress:
          type: string
          description: Source wallet address
        toAddress:
          type: string
          description: Destination wallet address
        txDigest:
          type: string
          description: Transaction digest/hash
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    Payout:
      type: object
      properties:
        id:
          type: string
          description: Payout unique identifier
          example: payout_abc123
        walletAddress:
          type: string
          description: Destination wallet address
          example: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb'
        network:
          type: string
          enum: [SUI]
          description: Blockchain network
          example: SUI
        amount:
          type: string
          description: Payout amount
          example: '10.50'
        status:
          type: string
          enum: [INITIALIZED, CONFIRMED, FAILED]
          description: Payout status
          example: CONFIRMED
        txDigest:
          type: string
          description: Transaction digest
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
    Refund:
      type: object
      properties:
        id:
          type: string
          description: Refund unique identifier
          example: refund_abc123
        amount:
          type: number
          description: Refunded amount
          example: 100
        status:
          type: string
          description: Refund status
          example: CONFIRMED
        transactionId:
          type: string
          description: Original transaction ID
        toAddress:
          type: string
          description: Refund destination address
        reason:
          type: string
          description: Refund reason
        txDigest:
          type: string
          description: Refund transaction digest
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
    BusinessProfile:
      type: object
      properties:
        id:
          type: string
          description: Business profile unique identifier
          example: profile_abc123
        businessName:
          type: string
          description: Business name
          example: Acme Corp
        businessSector:
          type: string
          description: Business sector/industry
          example: E-commerce
        country:
          type: string
          description: Country of operation
          example: NG
        websiteLink:
          type: string
          format: uri
          description: Business website URL
        email:
          type: string
          format: email
          description: Business email
        isLive:
          type: boolean
          description: Whether account is in live mode
          example: true
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
    CryptoAccount:
      type: object
      properties:
        id:
          type: string
          description: Account unique identifier
          example: crypto_acc_123
        address:
          type: string
          description: Cryptocurrency wallet address
          example: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb'
        alias:
          type: string
          description: Wallet alias/name
          example: Main Wallet
        chain:
          type: string
          enum: [SUI]
          description: Blockchain network
          example: SUI
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
    FiatAccount:
      type: object
      properties:
        id:
          type: string
          description: Account unique identifier
          example: fiat_acc_123
        bankName:
          type: string
          description: Bank name
          example: Access Bank
        bankCode:
          type: string
          description: Bank code
          example: '044'
        accountNumber:
          type: string
          description: Bank account number
          example: '1234567890'
        accountHolder:
          type: string
          description: Account holder name
          example: John Doe
        isPrimary:
          type: boolean
          description: Is this the primary settlement account
          example: true
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp

  responses:
    BadRequest:
      description: Bad request - Invalid input or validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Validation error message
    Unauthorized:
      description: Unauthorized - Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Unauthorized access
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Resource not found

  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for merchant authentication required for most endpoints
